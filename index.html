(function () {
  const currentScript = document.currentScript;

  function initHeroSnow() {
    /*
      Find the T123 block containing this code,
      then find the regular page block immediately above it.
    */
    const t123Block = currentScript.closest('.t-rec');

    if (!t123Block) {
      console.warn('Snow: T123 block was not found.');
      return;
    }

    let heroBlock = t123Block.previousElementSibling;

    while (heroBlock && !heroBlock.classList.contains('t-rec')) {
      heroBlock = heroBlock.previousElementSibling;
    }

    if (!heroBlock) {
      console.warn('Snow: Hero block was not found above T123.');
      return;
    }

    const canvas = document.getElementById('hero-snow-canvas');

    if (!canvas) return;

    /*
      Move the canvas out of T123 and into the Hero block.
    */
    heroBlock.appendChild(canvas);

    heroBlock.style.position = 'relative';
    heroBlock.style.overflow = 'hidden';
    heroBlock.style.isolation = 'isolate';

    const ctx = canvas.getContext('2d');

    let width = 0;
    let height = 0;
    let flakes = [];
    let animationFrame = null;
    let isVisible = false;

    function resizeCanvas() {
      const pixelRatio = window.devicePixelRatio || 1;

      width = heroBlock.clientWidth;
      height = heroBlock.clientHeight;

      canvas.width = Math.round(width * pixelRatio);
      canvas.height = Math.round(height * pixelRatio);

      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';

      ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
    }

    function createFlake(startAnywhere = true) {
      return {
        x: Math.random() * width,
        y: startAnywhere ? Math.random() * height : -20,
        radius: Math.random() * 2.8 + 0.8,
        speed: Math.random() * 1 + 0.35,
        drift: Math.random() * 0.6 - 0.3,
        opacity: Math.random() * 0.5 + 0.35,
        wave: Math.random() * 0.02 + 0.008
      };
    }

    function createSnowflakes() {
      const amount = Math.max(
        60,
        Math.min(160, Math.floor(width / 10))
      );

      flakes = Array.from(
        { length: amount },
        () => createFlake(true)
      );
    }

    function drawSnow() {
      if (!isVisible) {
        animationFrame = null;
        return;
      }

      ctx.clearRect(0, 0, width, height);

      flakes.forEach((flake) => {
        ctx.beginPath();
        ctx.fillStyle =
          `rgba(255, 255, 255, ${flake.opacity})`;

        ctx.arc(
          flake.x,
          flake.y,
          flake.radius,
          0,
          Math.PI * 2
        );

        ctx.fill();

        flake.y += flake.speed;
        flake.x +=
          flake.drift +
          Math.sin(flake.y * flake.wave) * 0.2;

        if (flake.y > height + 20) {
          Object.assign(flake, createFlake(false));
        }

        if (flake.x > width + 20) {
          flake.x = -20;
        }

        if (flake.x < -20) {
          flake.x = width + 20;
        }
      });

      animationFrame = requestAnimationFrame(drawSnow);
    }

    function startSnow() {
      if (isVisible) return;

      isVisible = true;

      if (!animationFrame) {
        drawSnow();
      }
    }

    function stopSnow() {
      isVisible = false;

      if (animationFrame) {
        cancelAnimationFrame(animationFrame);
        animationFrame = null;
      }

      ctx.clearRect(0, 0, width, height);
    }

    function restartSnow() {
      resizeCanvas();
      createSnowflakes();

      if (isVisible && !animationFrame) {
        drawSnow();
      }
    }

    /*
      Snow runs only while the Hero section is visible.
    */
    const observer = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            startSnow();
          } else {
            stopSnow();
          }
        });
      },
      {
        threshold: 0.01
      }
    );

    observer.observe(heroBlock);

    resizeCanvas();
    createSnowflakes();

    window.addEventListener('resize', restartSnow);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initHeroSnow);
  } else {
    initHeroSnow();
  }
})();
